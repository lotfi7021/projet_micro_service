server.port=8085
spring.application.name=API-GATEWAY

# EUREKA
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ROUTES
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=reclamation-service
spring.cloud.gateway.routes[2].uri=lb://RECLAMATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/reclamations/**

spring.cloud.gateway.routes[3].id=products-service
spring.cloud.gateway.routes[3].uri=lb://PRODUCTS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/products/**,/api/product-types/**,/api/product-locations/**,/api/historique/**

spring.cloud.gateway.routes[4].id=facture-service
spring.cloud.gateway.routes[4].uri=http://facture-service:8000
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/factures/**

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://vue-project:5173,http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true